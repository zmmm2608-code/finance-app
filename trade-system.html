<style>
  :root{
    --bg:#f6f7f9;--card:#ffffff;--text:#1a1d24;--muted:#7a8290;--border:#e4e7ec;
    --accent:#185FA5;--accent-soft:#E6F1FB;
    --up:#d64541;--down:#2e9e5b;--warn:#ba7517;
  }
  [data-theme="dark"]{
    --bg:#14161a;--card:#1d2026;--text:#e8eaed;--muted:#9aa2ad;--border:#2c313a;
    --accent:#85B7EB;--accent-soft:#0C447C;
    --up:#f07b76;--down:#5dbb82;--warn:#ef9f27;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
  header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .logo{color:var(--accent);font-size:18px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{border:none;background:none;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
  nav button:hover{color:var(--text);background:var(--accent-soft)}
  nav button.active{color:var(--accent);background:var(--accent-soft)}
  .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 13px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06);color:#fff}
  .btn.small{padding:5px 9px;font-size:12px}
  .btn.danger{color:var(--up);border-color:var(--up)}
  .btn.danger:hover{background:var(--up);color:#fff}
  main{padding:24px;max-width:1180px;margin:0 auto}
  section{display:none}
  section.active{display:block}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h3{font-size:15px;font-weight:600;margin-bottom:12px}
  .muted{color:var(--muted);font-size:12px}
  .grid{display:grid;gap:16px}
  .g-2{grid-template-columns:1fr 1fr}
  .g-stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .stat .label{font-size:12px;color:var(--muted)}
  .stat .value{font-size:22px;font-weight:600;margin:4px 0}
  .stat .sub{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
  tr:hover td{background:var(--accent-soft)}
  .up{color:var(--up)}
  .down{color:var(--down)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .tag.win{background:#fdeaea;color:var(--up)}
  .tag.loss{background:#e8f7ee;color:var(--down)}
  .tag.flat{background:var(--bg);color:var(--muted)}
  .tag.bad{background:#fdeaea;color:var(--up)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--card);color:var(--text);font-family:inherit}
  .field textarea{min-height:60px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .field-row{display:flex;gap:12px;flex-wrap:wrap}
  .field-row .field{flex:1;min-width:140px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:10px}
  .flow{display:flex;flex-direction:column;gap:10px}
  .flow-step{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
  .flow-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
  .flow-step .t{font-weight:600;margin-bottom:3px}
  .rule-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
  .rule-item:last-child{border-bottom:none}
  .rule-cat{flex-shrink:0;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;margin-top:2px}
  .rule-text{flex:1}
  .rule-ops{flex-shrink:0;display:flex;gap:4px}
  .sync-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--text);transition:all .15s}
  .sync-badge:hover{border-color:var(--accent)}
  .sync-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);position:relative;flex-shrink:0}
  .sync-badge .dot::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid currentColor;opacity:.18}
  .sync-badge.state-ok{color:var(--down)}
  .sync-badge.state-ok .dot{background:var(--down)}
  .sync-badge.state-saving{color:var(--accent)}
  .sync-badge.state-saving .dot{background:var(--accent);animation:pulse 1.1s infinite}
  .sync-badge.state-pending{color:#b45309;border-color:#fbbf24;background:#fffbeb}
  .sync-badge.state-pending .dot{background:#f59e0b}
  .sync-badge.state-error{color:var(--up);border-color:var(--up)}
  .sync-badge.state-error .dot{background:var(--up)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-50px);background:var(--down);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:720px){
    main{padding:14px}
    .g-2{grid-template-columns:1fr}
    .card{padding:14px}
    header{gap:8px}
    nav button{padding:6px 9px;font-size:12px}
    table{font-size:12px}
  }
</style>

<script>
"use strict";
const LS_KEY = "ts_system_v1";
const THEME_KEY = "ts_theme";

/* ============ 常量 ============ */
const MARKETS = ["A股","港股","美股","加密货币","期货"];
const PHASES = ["进攻(趋势)","震荡","防守(下跌)"];
const CYCLES = ["短线","波段","中长线"];
const DIRECTIONS = ["做多","做空"];
const STRATEGIES = ["趋势突破","趋势回踩","震荡低吸","震荡高抛","反转","其他"];
const EXEC_QUALITY = ["到位","一般","违反纪律"];
const RULE_CATS = ["仓位","止损","心态","市场","执行"];

/* ============ 默认数据 ============ */
function defaultRules(){
  return [
    {id:"r1",category:"仓位",text:"仓位由可承受风险反推，不由主观信心正推——信心高不等于该重仓。"},
    {id:"r2",category:"仓位",text:"单笔风险预算 ÷ 止损距离 = 仓位；止损距离越远，仓位越小。"},
    {id:"r3",category:"仓位",text:"分仓推进，不要一把梭：试错仓 → 确认仓 → 加仓仓。"},
    {id:"r4",category:"止损",text:"止损位写完就是写完，触发后禁止改规则、禁止事后宽松。"},
    {id:"r5",category:"止损",text:"三维止损：价格位 + 逻辑失效 + 时间止损，三者独立触发。"},
    {id:"r6",category:"止损",text:"区分噪音与真失效：快速插针是诱空，连续破位才是真失效。"},
    {id:"r7",category:"心态",text:"成本价不是市场关心的变量，市场只关心当前位置该不该持有。"},
    {id:"r8",category:"心态",text:"「回到成本就卖」是心理锚，不是市场决定的卖点。"},
    {id:"r9",category:"心态",text:"浮盈被打回成本是退出理由，不是死扛理由。"},
    {id:"r10",category:"市场",text:"先定市场（进攻/震荡/防守），再定策略，最后选股——顺序不能反。"},
    {id:"r11",category:"市场",text:"市场性质决定打法：不能用趋势策略做震荡市，也不能用震荡策略做趋势市。"},
    {id:"r12",category:"市场",text:"环境不支持时，敢于不进场、敢于降仓。"},
    {id:"r13",category:"执行",text:"每笔交易先写计划（入场/止损/目标/失效条件），没有计划不下单。"},
    {id:"r14",category:"执行",text:"记录每一笔，复盘才有数据；不复盘的交易经验不会积累。"}
  ];
}
function defaultDB(){
  return {version:1, marketLog:[], trades:[], rules:defaultRules()};
}

/* ============ Supabase 云同步（与个人财务管家共用 Supabase 配置） ============ */
// 关键设计：两个工具共用一个 Supabase 项目、一张 user_data 表
// 通过 data._meta.tool 区分（"finance" / "trade-system"），互不干扰
const SUPABASE_CFG_KEY = "pfm_supabase_cfg";     // 与财务管家共用 key，避免重复配置
const SUPABASE_TABLE   = "user_data";
const PRODUCT_ID       = "trade-system";
let sbClient = null;
let sbUser   = null;
let autoSyncTimer = null;
const AUTO_SYNC_DELAY = 2000;

function sbGetCfg(){ try{ return JSON.parse(localStorage.getItem(SUPABASE_CFG_KEY)) || {}; }catch(e){ return {}; } }
function sbSetCfg(cfg){ localStorage.setItem(SUPABASE_CFG_KEY, JSON.stringify(cfg)); }
function sbClearCfg(){ localStorage.removeItem(SUPABASE_CFG_KEY); sbClient=null; }

async function sbEnsureClient(){
  if(sbClient) return sbClient;
  const { url, anonKey } = sbGetCfg();
  if(!url || !anonKey){ throw new Error("尚未配置 Supabase，请先在「设置 → 云同步」中保存 Project URL 与 anon key"); }
  if(!window.supabase){ throw new Error("Supabase SDK 还未加载，请检查网络后刷新页面"); }
  sbClient = window.supabase.createClient(url, anonKey, { auth: { storageKey: "ts-sb-auth", persistSession: true, autoRefreshToken: true } });
  return sbClient;
}
async function sbWaitForUser(){
  try{
    const { data } = await sbClient.auth.getSession();
    return (data && data.session && data.session.user) || null;
  }catch(e){ return null; }
}

/* ============ 存储 ============ */
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      return Object.assign(defaultDB(), d);
    }
  }catch(e){}
  return defaultDB();
}
let DB = load();
function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    showToast("✓ 已保存");
    queueAutoSync();
  }catch(e){ alert("保存失败："+e.message); }
}
let _toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  if(!el) return;
  el.textContent = msg || "✓ 已保存";
  el.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove("show"), 1400);
}

/* ============ 同步徽章 ============ */
function setSyncBadge(state, text){
  const b = document.getElementById("syncBadge");
  const t = document.getElementById("syncBadgeTxt");
  if(!b || !t) return;
  b.classList.remove("state-ok","state-saving","state-pending","state-error");
  if(state && state !== "idle") b.classList.add("state-"+state);
  if(text) t.textContent = text;
}
function syncBadgeClick(){ switchTab("settings"); setTimeout(()=>{ const ta=document.getElementById("tab-settings"); if(ta) ta.scrollIntoView({block:"start"}); }, 50); }
function setSyncStatus(txt, isErr){
  const el = document.getElementById("syncStatus");
  if(el){ el.style.color = isErr ? "var(--up)" : "var(--down)"; el.textContent = txt ? (" · " + txt) : ""; }
  if(!txt){ setSyncBadge(null, "已登录"); }
  else if(isErr){ setSyncBadge("error", txt.replace(/^.+?: /, "失败 ").slice(0, 18)); }
  else if(txt.includes("✅") || txt.includes("已")){ setSyncBadge("ok", "已同步"); }
  else{ setSyncBadge("saving", txt.replace(/^.+?: /, "").slice(0, 18)); }
}

async function sbLoadRow(){
  if(!sbUser){ sbUser = await sbWaitForUser(); }
  if(!sbUser) return null;
  const { data, error } = await sbClient.from(SUPABASE_TABLE).select("data").eq("user_id", sbUser.id).maybeSingle();
  if(error){ console.warn("sbLoadRow:", error); return null; }
  return data ? data.data : null;
}
async function sbSaveRow(payload){
  if(!sbUser){ sbUser = await sbWaitForUser(); }
  if(!sbUser) throw new Error("未登录");
  const { error } = await sbClient.from(SUPABASE_TABLE).upsert({
    user_id: sbUser.id,
    data: payload,
    updated_at: new Date().toISOString()
  });
  if(error) throw error;
}
async function sbDeleteRow(){
  if(!sbUser) throw new Error("未登录");
  const { error } = await sbClient.from(SUPABASE_TABLE).delete().eq("user_id", sbUser.id);
  if(error) throw error;
}

/* ============ 业务数据 ↔ 云 payload ============ */
// 两个工具共用 user_data 表，data 顶层就是 JSONB
// 区别靠 _meta.tool；同一账户的两个工具 data 是两个独立对象，不会互相覆盖
function dbToCloudPayload(){
  const o = JSON.parse(JSON.stringify(DB));
  o._meta = { tool: PRODUCT_ID, schema: 1, savedAt: Date.now() };
  return o;
}
function cloudPayloadToDB(p){
  if(!p) return;
  // 校验 _meta.tool 必须匹配本工具（防止错把财务管家数据塞进交易系统）
  if(p._meta && p._meta.tool && p._meta.tool !== PRODUCT_ID){
    console.warn("云端数据来自另一个工具("+p._meta.tool+")，已忽略。");
    return;
  }
  DB = Object.assign(defaultDB(), {
    marketLog: p.marketLog || [],
    trades: p.trades || [],
    rules: (p.rules && p.rules.length) ? p.rules : DB.rules
  });
}

function queueAutoSync(){
  if(!sbClient || !sbUser) return;
  setSyncBadge("pending", "待同步");
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(async ()=>{
    setSyncBadge("saving", "同步中...");
    try{
      await sbSaveRow(dbToCloudPayload());
      setSyncStatus("自动同步 ✅ " + new Date().toLocaleTimeString());
    }catch(e){
      setSyncStatus("自动同步失败: " + e.message, true);
      setSyncBadge("error", "同步失败");
    }
  }, AUTO_SYNC_DELAY);
}

/* ============ 工具 ============ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(n){
  n = +n||0;
  const neg = n<0;
  const s = Math.abs(n).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?"-":"")+s;
}
function pct(n){ n=+n||0; return (n>=0?"+":"")+n.toFixed(2)+"%"; }
function pnlClass(n){ return (+n||0)>=0 ? "up" : "down"; }
function uid(){ return "id-"+Date.now()+"-"+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }

/* ============ 主题 ============ */
function initTheme(){
  const t = localStorage.getItem(THEME_KEY)||"light";
  document.documentElement.setAttribute("data-theme",t);
  document.getElementById("btnTheme").textContent = t==="dark"?"☀️":"🌙";
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";

/* ============ 币安合约(U本位) 只读自动结算 ============ */
// 安全说明：Key/Secret 仅存于本机 localStorage，绝不写入网页源码；请用【只读权限】+【IP 白名单】+ 子账户 key
const BINANCE_CFG_KEY = "ts_binance_cfg";
const FAPI = "https://fapi.binance.com";
function bGetCfg(){ try{ return JSON.parse(localStorage.getItem(BINANCE_CFG_KEY))||{}; }catch(e){ return {}; } }
function bSetCfg(c){ localStorage.setItem(BINANCE_CFG_KEY, JSON.stringify(c)); }

async function bHmac(msg, secret){
  if(!crypto || !crypto.subtle) throw new Error("当前环境不支持本地签名，请通过 https 页面(GitHub Pages)打开本工具");
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret), {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(msg));
  return [...new Uint8Array(sig)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function bApi(path, params){
  const cfg = bGetCfg();
  if(!cfg.apiKey || !cfg.secret) throw new Error("请先填写并保存币安只读 API Key / Secret");
  const qs = new URLSearchParams(Object.assign({timestamp:Date.now(), recvWindow:60000}, params||{})).toString();
  const sig = await bHmac(qs, cfg.secret);
  const url = FAPI + path + "?" + qs + "&signature=" + sig;
  const res = await fetch(url, {headers:{"X-MBX-APIKEY": cfg.apiKey}});
  const j = await res.json();
  if(j && j.code) throw new Error("币安错误 " + j.code + ": " + (j.msg||""));
  return j;
}
async function bPub(path, params){
  const qs = new URLSearchParams(params||{}).toString();
  const res = await fetch(FAPI + path + (qs?"?"+qs:""));
  return res.json();
}
/* ---- FIFO 开平仓配对：把逐笔成交(fill)还原成一笔笔完整的 round-trip 交易 ----
   币安每一笔 fill 都带 realizedPnl：只有「平仓」那笔才非 0，开仓/加仓那笔恒为 0。
   原逻辑把 realizedPnl==0 当成「平手」，会把大量开仓单误算成平手交易，污染胜率。
   这里按 FIFO(先进先出) 把开仓 lot 与反向平仓配对，并把手续费按数量比例分摊进去。 */
function buildRoundTrips(fills, aggregate){
  // 按持仓模式分组：单向持仓=BOTH，双向持仓=LONG/SHORT 各自独立配对
  const groups = {};
  fills.forEach(f=>{
    const ps = f.positionSide || "BOTH";
    (groups[ps] = groups[ps] || []).push(f);
  });

  const roundTrips = [];
  const openLots = [];

  Object.keys(groups).forEach(ps=>{
    const arr = groups[ps].slice().sort((a,b)=>(a.time-b.time) || (a.id-b.id));
    let lots = [];  // FIFO 开仓队列
    let pos = 0;    // 当前净持仓（带符号：正=多，负=空）

    arr.forEach(f=>{
      const qty = Math.abs(+f.qty || 0);
      if(qty <= 1e-9) return;
      const price = +f.price || 0;
      const signed = (f.side === "SELL" ? -1 : 1) * qty;
      const rp  = +f.realizedPnl || 0;              // 该 fill 的已实现盈亏（平仓时非 0）
      const fee = Math.abs(+f.commission || 0);
      const newPos = pos + signed;

      if(pos === 0 || Math.sign(pos) === Math.sign(signed)){
        // ① 开仓 / 同向加仓
        // 聚合模式：同向加仓合并进最近的 lot 并按加权均价计算。
        // 否则「加仓 N 次再一次性平仓」会被拆成 N 条入场/出场/盈亏比几乎一样的记录，
        // 这正是笔数暴涨(如 305 笔成交 → 247 条)且盈亏%清一色相同的原因。
        if(aggregate && lots.length){
          const last = lots[lots.length-1];
          if(Math.sign(last.side) === Math.sign(signed)){
            const tq = last.qty + qty;
            last.price = (last.price*last.qty + price*qty) / tq;   // 加权平均入场价
            last.qty = tq;
            last.fee += fee;
            last.addIds = (last.addIds||[]).concat(f.id);          // 记录被合并的加仓单号
            pos = newPos;
            return;
          }
        }
        lots.push({qty, price, time:f.time, id:f.id, fee, side: signed>0?1:-1});
        pos = newPos;
      }else{
        // ② 反向 → 平仓（按 FIFO 从最早的 lot 开始吃）
        //    注意：realizedPnl 只对应「真正平仓的那部分」，手续费按「总成交量」收，两者分母不同。
        //    例如 SELL 2 平掉 1 个多仓再反手开 1 个空：rp 全归那 1 个平仓量，手续费却要按 2 份摊。
        const closeTotal = Math.abs(signed) || 1;                  // 本次成交总量（手续费分母）
        const closeQty   = Math.min(closeTotal, Math.abs(pos));     // 其中真正平仓的量（rp 分母）
        let remain = closeQty;

        while(remain > 1e-9 && lots.length){
          const lot = lots[0];
          const takeQty = Math.min(lot.qty, remain);
          const rpRatio  = takeQty / (closeQty || 1);        // rp 分摊：按平仓量
          const feeRatio = takeQty / closeTotal;             // 手续费分摊：按总成交量
          const lotRatio = takeQty / (lot.qty || 1);         // 开仓单手续费：按该 lot 占比

          const grossPnl = rp * rpRatio;                     // 分摊到的已实现盈亏（未扣费）
          const openFee = lot.fee * lotRatio;                // 开仓手续费分摊
          const closeFee = fee * feeRatio;                   // 平仓手续费分摊
          const totalFee = openFee + closeFee;
          const pnl = grossPnl - totalFee;                   // 净盈亏 = 毛盈亏 − 双边手续费

          const isLong = lot.side > 0;
          const entry = lot.price, exit = price;
          const pnlPct = entry>0 ? ((isLong ? (exit-entry)/entry : (entry-exit)/entry) * 100) : 0;

          roundTrips.push({
            symbol: f.symbol,
            direction: isLong ? "做多" : "做空",
            positionSide: ps,
            openTime: lot.time,
            closeTime: f.time,
            entryPrice: entry,
            exitPrice: exit,
            quantity: takeQty,
            grossPnl: grossPnl,
            fee: totalFee,
            pnl: pnl,
            pnlPct: pnlPct,
            holdMs: f.time - lot.time,
            autoKey: "b_" + f.symbol + "_" + lot.id + "_" + f.id
          });

          lot.qty -= takeQty;
          lot.fee -= openFee;
          remain  -= takeQty;
          if(lot.qty <= 1e-9) lots.shift();
        }

        pos = newPos;

        // ③ 平完仍有余量 → 反向开新仓
        if(newPos !== 0 && Math.sign(newPos) === Math.sign(signed)){
          const revQty = Math.abs(newPos);
          lots.push({qty: revQty, price, time:f.time, id:f.id, fee: fee*(revQty/closeTotal), side: signed>0?1:-1});
        }
      }
    });

    // 循环结束后仍在队列里的 = 当前未平持仓
    lots.forEach(l=>{
      openLots.push({
        symbol: (arr[0]||{}).symbol,
        direction: l.side>0 ? "做多" : "做空",
        positionSide: ps,
        qty: l.qty,
        entryPrice: l.price,
        openTime: l.time,
        fee: l.fee
      });
    });
  });

  roundTrips.sort((a,b)=>a.closeTime-b.closeTime);
  return {roundTrips, openLots};
}

/* 基于配对后的 round-trip 计算真实战绩（这才是复盘该看的数字） */
function computeRTStats(rt){
  const wins   = rt.filter(r=>r.pnl >  1e-9);
  const losses = rt.filter(r=>r.pnl < -1e-9);
  const flats  = rt.filter(r=>Math.abs(r.pnl) <= 1e-9);
  const decided = wins.length + losses.length;
  const winSum  = wins.reduce((s,r)=>s+r.pnl,0);
  const lossSum = Math.abs(losses.reduce((s,r)=>s+r.pnl,0));
  const avgWin  = wins.length   ? winSum/wins.length   : 0;
  const avgLoss = losses.length ? lossSum/losses.length : 0;
  const winRate = decided ? wins.length/decided*100 : 0;
  const pf = lossSum>0 ? winSum/lossSum : (winSum>0 ? Infinity : 0);
  const ev = decided ? (winRate/100*avgWin - (1-winRate/100)*avgLoss) : 0;
  return {
    n: rt.length, wins: wins.length, losses: losses.length, flats: flats.length, decided,
    winRate, avgWin, avgLoss, pf, ev, winSum, lossSum,
    totalPnl: rt.reduce((s,r)=>s+r.pnl,0),
    totalFee: rt.reduce((s,r)=>s+r.fee,0),
    avgHoldMs: rt.length ? rt.reduce((s,r)=>s+r.holdMs,0)/rt.length : 0,
    maxWin: rt.reduce((m,r)=>Math.max(m,r.pnl), 0),
    maxLoss: rt.reduce((m,r)=>Math.min(m,r.pnl), 0)
  };
}

/* 按持仓时长粗判交易周期，导入时填 cycle 字段 */
function bGuessCycle(ms){
  const h = ms/3600000;
  if(h < 4)  return "短线";
  if(h < 72) return "波段";
  return "中长线";
}
function bFmtHold(ms){
  if(!ms || ms<0) return "-";
  const m = Math.floor(ms/60000);
  if(m < 60) return m + "分";
  const h = Math.floor(m/60);
  if(h < 24) return h + "小时" + (m%60 ? (m%60)+"分" : "");
  return Math.floor(h/24) + "天" + (h%24 ? (h%24)+"小时" : "");
}

async function bSettle(symbols, aggregate){
  const acc = await bApi("/fapi/v2/account");
  const prices = {};
  await Promise.all(symbols.map(async s=>{
    try{ const p = await bPub("/fapi/v1/ticker/price", {symbol:s}); if(p && p.price) prices[s] = +p.price; }catch(e){}
  }));
  let totalRealized = 0, win = 0, loss = 0, flat = 0, trades = 0, winSum = 0, lossSum = 0;
  const bySymbol = {};
  const allFills = [];
  for(const s of symbols){
    let fromId = null, all = [];
    while(true){
      const p = {symbol:s, limit:1000}; if(fromId) p.fromId = fromId;
      let arr = [];
      try{ arr = await bApi("/fapi/v1/userTrades", p); }catch(e){ arr = []; }
      if(!Array.isArray(arr) || !arr.length) break;
      all = all.concat(arr);
      if(arr.length < 1000) break;
      fromId = arr[arr.length-1].id + 1;
    }
    allFills.push.apply(allFills, all);
    bySymbol[s] = {realized:0, win:0, loss:0, flat:0};
    for(const t of all){
      const rp = +t.realizedPnl;
      totalRealized += rp; bySymbol[s].realized += rp; trades++;
      if(rp > 0){ win++; winSum += rp; bySymbol[s].win++; }
      else if(rp < 0){ loss++; lossSum += (-rp); bySymbol[s].loss++; }
      else { flat++; bySymbol[s].flat++; }
    }
  }
  const totalClose = win + loss;
  const winRate = totalClose ? (win/totalClose*100) : 0;
  const pf = lossSum ? (winSum/lossSum) : (winSum>0 ? Infinity : 0);
  const avgWin = win ? winSum/win : 0;
  const avgLoss = loss ? lossSum/loss : 0;
  const unrealized = (acc.positions||[]).filter(p=>+p.positionAmt!==0).reduce((a,p)=>a+(+p.unRealizedProfit||0),0);
  // FIFO 配对：把逐笔成交还原成完整开平仓交易，并算真实战绩
  const {roundTrips, openLots} = buildRoundTrips(allFills, aggregate);
  const rtStat = computeRTStats(roundTrips);
  return {acc, prices, totalRealized, win, loss, flat, trades, winRate, pf, avgWin, avgLoss, unrealized, bySymbol, roundTrips, openLots, rtStat, aggregate: !!aggregate};
}
function bSaveCfg(){
  bSetCfg({
    apiKey: document.getElementById("bKey").value.trim(),
    secret: document.getElementById("bSecret").value.trim(),
    symbols: document.getElementById("bSymbols").value.split(",").map(s=>s.trim().toUpperCase()).filter(Boolean)
  });
  showToast("✓ 已保存");
}
function initBinance(){
  const c = bGetCfg();
  if(document.getElementById("bKey")) document.getElementById("bKey").value = c.apiKey||"";
  if(document.getElementById("bSecret")) document.getElementById("bSecret").value = c.secret||"";
  if(document.getElementById("bSymbols")) document.getElementById("bSymbols").value = (c.symbols||[]).join(",");
}
let LAST_B_RESULT = null;   // 最近一次结算结果，供「同步到交易记录」使用
async function bRun(){
  const cfg = bGetCfg();
  if(!cfg.apiKey || !cfg.secret || !cfg.symbols || !cfg.symbols.length){
    document.getElementById("bStatus").textContent = "请先填写并保存配置（Key / Secret / 交易对）";
    return;
  }
  document.getElementById("bStatus").textContent = "正在拉取并结算...";
  try{
    const aggEl = document.getElementById("bAggregate");
    const r = await bSettle(cfg.symbols, aggEl ? aggEl.checked : false);
    LAST_B_RESULT = r;
    document.getElementById("bResult").innerHTML = bRender(r);
    document.getElementById("bStatus").textContent = "更新于 " + new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById("bStatus").textContent = "失败：" + e.message + "（若为网络错误，请确认浏览器可连通 fapi.binance.com，必要时用代理）";
  }
}

/* 清除此前自动导入的记录（手动录入的不受影响）。
   切换「合并加仓」开关后必须先清一次：两种模式算出的 autoKey 不同，
   不去重机制拦不住，会导致新旧记录并存、统计翻倍。 */
function bClearAuto(){
  const n = DB.trades.filter(t=>t.source==="binance-auto").length;
  if(!n){ showToast("没有自动导入的记录"); return; }
  if(!confirm("将删除 " + n + " 条 AUTO 自动导入记录。\n手动录入的交易不受影响，确定继续？")) return;
  DB.trades = DB.trades.filter(t=>t.source!=="binance-auto");
  save(); renderAll();
  showToast("✓ 已清除 " + n + " 条，可重新导入");
}

/* 把配对好的 round-trip 写入 DB.trades，打通币安数据与复盘分析。
   用 autoKey(交易对+开仓单号+平仓单号) 去重，重复点击不会重复导入。 */
function bImportToJournal(){
  if(!LAST_B_RESULT || !LAST_B_RESULT.roundTrips || !LAST_B_RESULT.roundTrips.length){
    showToast("请先点「拉取并结算」");
    return;
  }
  const rts = LAST_B_RESULT.roundTrips;
  const exist = new Set(DB.trades.map(t=>t.autoKey).filter(Boolean));
  let added = 0, skipped = 0;
  rts.forEach(rt=>{
    if(exist.has(rt.autoKey)){ skipped++; return; }
    const pnl = +(+rt.pnl).toFixed(2);
    DB.trades.push({
      id: uid(),
      autoKey: rt.autoKey,
      source: "binance-auto",
      date: new Date(rt.closeTime).toISOString().slice(0,10),
      market: "加密货币",
      symbol: rt.symbol,
      name: rt.symbol,
      direction: rt.direction,
      cycle: bGuessCycle(rt.holdMs),
      strategy: "",
      entryPrice: +(+rt.entryPrice).toFixed(8),
      exitPrice: +(+rt.exitPrice).toFixed(8),
      quantity: +(+rt.quantity).toFixed(8),
      pnl: pnl,
      pnlPct: +(+rt.pnlPct).toFixed(2),
      result: pnl>0 ? "盈利" : pnl<0 ? "亏损" : "平手",
      execQuality: "",
      emotionNote: "",
      lesson: "",
      fee: +(+rt.fee).toFixed(4),
      holdMs: rt.holdMs
    });
    added++;
  });
  save();
  renderAll();
  showToast(added ? ("✓ 已导入 " + added + " 笔" + (skipped ? "（跳过重复 " + skipped + "）" : "")) : "无新增（全部已导入过）");
}
function bRender(r){
  const m = n => (n>=0?"+":"") + (+n).toLocaleString("zh-CN",{maximumFractionDigits:2});
  const cls = n => n>=0 ? "up":"down";
  const equity = (+r.acc.totalWalletBalance||0) + (+r.acc.totalUnrealizedProfit||0);
  let h = `<div class="grid g-stats">
    <div class="card stat"><div class="label">账户权益(USDT)</div><div class="value">${equity.toFixed(2)}</div><div class="sub">可用 ${r.acc.availableBalance}</div></div>
    <div class="card stat"><div class="label">总已实现盈亏</div><div class="value ${cls(r.totalRealized)}">${m(r.totalRealized)}</div><div class="sub">${r.trades} 笔成交</div></div>
    <div class="card stat"><div class="label">未实现浮盈</div><div class="value ${cls(r.unrealized)}">${m(r.unrealized)}</div></div>
    <div class="card stat"><div class="label">胜率</div><div class="value">${r.winRate.toFixed(1)}%</div><div class="sub">盈 ${r.win} / 亏 ${r.loss}</div></div>
    <div class="card stat"><div class="label">盈亏比(Profit Factor)</div><div class="value">${isFinite(r.pf)?r.pf.toFixed(2):"∞"}</div><div class="sub">均盈 ${m(r.avgWin)} / 均亏 ${m(-r.avgLoss)}</div></div>
  </div>`;
  h += `<div class="card"><h3>按交易对结算</h3><table><thead><tr><th>交易对</th><th>已实现盈亏</th><th>盈利笔</th><th>亏损笔</th><th>现价</th></tr></thead><tbody>`;
  for(const s in r.bySymbol){
    const b = r.bySymbol[s];
    h += `<tr><td>${s}</td><td class="${cls(b.realized)}">${m(b.realized)}</td><td>${b.win}</td><td>${b.loss}</td><td>${r.prices[s]!=null?r.prices[s]:"-"}</td></tr>`;
  }
  h += `</tbody></table></div>`;

  /* ---- 配对后的真实战绩（round-trip） ---- */
  const rt  = r.rtStat || {};
  const rts = r.roundTrips || [];
  h += `<div class="card" style="margin-top:16px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="margin:0">真实战绩（开平仓配对后）</h3>
      <span class="muted">${r.aggregate ? "合并加仓模式 · 同向加仓按加权均价并成 1 条" : "逐笔模式 · 每次加仓单独成条"} · 已扣双边手续费</span>
      <span style="margin-left:auto"></span>
      <button class="btn primary" onclick="bImportToJournal()">⬇ 同步到交易记录</button>
    </div>
    <div class="grid g-stats" style="margin-top:12px">
      <div class="card stat"><div class="label">完整交易笔数</div><div class="value">${rt.n||0}</div><div class="sub">赢 ${rt.wins||0} / 亏 ${rt.losses||0} / 平 ${rt.flats||0}</div></div>
      <div class="card stat"><div class="label">胜率</div><div class="value">${(rt.winRate||0).toFixed(1)}%</div><div class="sub">已决 ${rt.decided||0} 笔</div></div>
      <div class="card stat"><div class="label">盈亏比 PF</div><div class="value">${rt.pf===Infinity?"∞":(rt.pf||0).toFixed(2)}</div><div class="sub">均盈 ${m(rt.avgWin||0)} / 均亏 ${m(-(rt.avgLoss||0))}</div></div>
      <div class="card stat"><div class="label">期望值 / 笔</div><div class="value ${cls(rt.ev||0)}">${m(rt.ev||0)}</div><div class="sub">胜率×均盈 − 败率×均亏</div></div>
      <div class="card stat"><div class="label">净盈亏(已扣费)</div><div class="value ${cls(rt.totalPnl||0)}">${m(rt.totalPnl||0)}</div><div class="sub">手续费合计 ${(rt.totalFee||0).toFixed(2)}</div></div>
      <div class="card stat"><div class="label">平均持仓</div><div class="value">${bFmtHold(rt.avgHoldMs||0)}</div><div class="sub">最大盈 ${m(rt.maxWin||0)} / 最大亏 ${m(rt.maxLoss||0)}</div></div>
    </div>
  </div>`;

  /* ---- 当前未平持仓 ---- */
  const lots = r.openLots || [];
  if(lots.length){
    h += `<div class="card" style="margin-top:16px"><h3>当前未平持仓（FIFO 还原）</h3>
      <div style="overflow-x:auto"><table><thead><tr><th>交易对</th><th>方向</th><th>数量</th><th>开仓均价</th><th>现价</th><th>浮动</th><th>开仓时间</th></tr></thead><tbody>`;
    lots.forEach(l=>{
      const cur  = r.prices[l.symbol];
      const diff = (cur!=null && l.entryPrice) ? (l.direction==="做多" ? (cur-l.entryPrice) : (l.entryPrice-cur)) * l.qty : null;
      h += `<tr><td>${esc(l.symbol)}</td><td>${l.direction==="做多"?'<span class="tag win">做多</span>':'<span class="tag loss">做空</span>'}</td><td>${(+l.qty).toFixed(4)}</td><td>${(+l.entryPrice).toFixed(4)}</td><td>${cur!=null?cur:"-"}</td><td class="${diff==null?"":cls(diff)}">${diff==null?"-":m(diff)}</td><td>${new Date(l.openTime).toLocaleString("zh-CN")}</td></tr>`;
    });
    h += `</tbody></table></div></div>`;
  }

  /* ---- 最近 round-trip 明细 ---- */
  if(rts.length){
    const recent = rts.slice(-25).reverse();
    h += `<div class="card" style="margin-top:16px"><h3>最近平仓明细（共 ${rts.length} 笔完整交易，显示最近 ${recent.length} 笔）</h3>

/* ============ 复盘分析 ============ */
function computeStats(){
  const trades = DB.trades;
  const wins = trades.filter(t=>t.result==="盈利");
  const losses = trades.filter(t=>t.result==="亏损");
  const flats = trades.filter(t=>t.result==="平手");
  const decided = wins.length+losses.length;
  const winRate = decided ? wins.length/decided*100 : 0;
  const avgWin = wins.length ? wins.reduce((s,t)=>s+(+t.pnl||0),0)/wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s,t)=>s+(+t.pnl||0),0)/losses.length) : 0;
  const profitFactor = avgLoss>0 ? avgWin/avgLoss : (avgWin>0?Infinity:0);
  const totalPnl = trades.reduce((s,t)=>s+(+t.pnl||0),0);
  const ev = decided ? (winRate/100*avgWin - (1-winRate/100)*avgLoss) : 0;
  return {trades, wins, losses, flats, decided, winRate, avgWin, avgLoss, profitFactor, totalPnl, ev};
}
function groupStats(key, label){
  const map = {};
  DB.trades.forEach(t=>{
    const k = t[key] || "未标注";
    map[k] = map[k] || {n:0, win:0, loss:0, pnl:0};
    map[k].n++;
    if(t.result==="盈利")map[k].win++;
    if(t.result==="亏损")map[k].loss++;
    map[k].pnl += (+t.pnl||0);
  });
  return Object.entries(map).map(([k,v])=>{
    const decided = v.win+v.loss;
    const wr = decided ? (v.win/decided*100) : 0;
    return {k, n:v.n, wr, pnl:v.pnl};
  });
}
function groupTable(key, label, rows){
  if(!rows.length) return `<p class="muted">暂无数据</p>`;
  const sorted=[...rows].sort((a,b)=>b.pnl-a.pnl);
  return `<table><thead><tr><th>${label}</th><th>笔数</th><th>胜率</th><th>累计盈亏</th></tr></thead>

}

function openAuthModal(mode){
  const cfg = sbGetCfg();
  if(!cfg.url || !cfg.anonKey){ alert("请先配置 Supabase URL 与 anon key"); return; }
  openModal(mode==="register"?"注册新账号":"登录", `
    <div class="field"><label>邮箱</label><input type="email" id="sb_email" placeholder="you@example.com"></div>
    <div class="field" style="margin-top:10px"><label>密码（至少 6 位）</label><input type="password" id="sb_password" placeholder="********"></div>
    <p class="muted" id="sb_msg" style="margin-top:10px;font-size:12px"></p>
  `, async ()=>{
    const email = (document.getElementById("sb_email").value||"").trim();
    const password = document.getElementById("sb_password").value||"";
    const msg = document.getElementById("sb_msg");
    msg.style.color = "var(--muted)"; msg.textContent = "处理中...";
    if(!email || !password){ msg.style.color="var(--up)"; msg.textContent="请填写邮箱和密码"; return; }
    try{
      sbClient = await sbEnsureClient();
      const res = mode==="register"
        ? await sbClient.auth.signUp({email, password})
        : await sbClient.auth.signInWithPassword({email, password});
      if(res.error){ msg.style.color="var(--up)"; msg.textContent = res.error.message; return; }
      sbUser = (res.data && res.data.user) || null;
      if(!sbUser){ msg.style.color="var(--warn)"; msg.textContent="未返回用户对象。"; return; }
      setSyncBadge("ok","已登录");
      const localNonEmpty = (DB.marketLog.length + DB.trades.length + DB.rules.filter(r=>!defaultRules().some(dr=>dr.text===r.text)).length) > 0;
      closeModal();
      await reconcileAfterLogin(localNonEmpty);
      renderSettings();
    }catch(e){
      msg.style.color="var(--up)"; msg.textContent = e.message||String(e);
    }
  }, mode==="register"?"注册":"登录");
  setTimeout(()=>document.getElementById("sb_email")?.focus(), 60);
}

async function cloudLogout(){
  if(!sbClient) return;
  if(!confirm("退出登录后，本设备的数据仍保留。确定退出？")) return;
  try{ await sbClient.auth.signOut(); }catch(e){}
  sbUser = null;
  setSyncBadge(null, "未登录");
  renderSettings();
}

async function reconcileAfterLogin(localNonEmpty){
  let remote = null;
  try{ remote = await sbLoadRow(); }catch(e){ console.warn(e); }
  // _meta.tool 校验：另一个工具的数据不应该被误加载
  if(remote && remote._meta && remote._meta.tool && remote._meta.tool !== PRODUCT_ID){
    const yes = confirm("云端有「"+(remote._meta.tool==="finance"?"个人财务管家":"另一个工具")+"」的数据，但本工具尚未同步过。\n是否继续（云端目前对本工具来说为空）？");
    if(!yes) return;
    remote = null;
  }
  const remoteEmpty = !remote || ((!remote.marketLog || !remote.marketLog.length) && (!remote.trades || !remote.trades.length));
  if(remoteEmpty && localNonEmpty){
    if(confirm("云端无「交易系统」数据。是否把当前浏览器内的本地数据推到云端？\n（取消则只登录查看，不上传）")){
      await sbSaveRow(dbToCloudPayload());
      alert("本地数据已推到云端 ✅");
    }
  } else if(!remoteEmpty && !localNonEmpty){
    if(confirm("云端已有交易系统数据，本地为空。是否拉取到本设备？")){
      cloudPayloadToDB(remote); save(); renderAll();
    }
  } else if(!remoteEmpty && localNonEmpty){
    const choice = prompt("本地与云端都有数据。请选择处理方式：\n1 - 用本地覆盖云端\n2 - 用云端覆盖本地（覆盖前自动备份）\n3 - 暂不处理\n输入 1/2/3：");
    if(choice==="1"){ await sbSaveRow(dbToCloudPayload()); alert("已用本地覆盖云端 ✅"); }
    else if(choice==="2"){
      exportDataSilent();
      cloudPayloadToDB(remote); save(); renderAll();
      alert("已用云端覆盖本地（已自动备份原数据）");
    }
  }
}

async function cloudPullNow(){

async function cloudResetAndPush(){

  }catch(e){ setSyncStatus("重置失败: " + e.message, true); setSyncBadge("error","重置失败"); alert("重置失败："+e.message); }

async function sbInitOnLoad(){

  if(!cfg.url || !cfg.anonKey){ setSyncBadge(null, "未配置"); return; }
  try{
    sbClient = await sbEnsureClient();
    const { data } = await sbClient.auth.getSession();
    sbUser = data?.session?.user || null;
    if(sbUser){
      setSyncBadge("ok","已登录");
      sbClient.auth.onAuthStateChange((_event, session)=>{

  renderSettings();

function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "交易系统备份-"+today()+".json";

function importData(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(!d || typeof d!=="object") throw new Error("格式错误");
      DB = Object.assign(defaultDB(), d);
      if(!Array.isArray(DB.rules)||!DB.rules.length) DB.rules = defaultRules();
      save();renderAll();
      showToast("✓ 导入成功");
    }catch(e){ alert("导入失败："+e.message); }
  };
  reader.readAsText(file);
  input.value = "";
}

function clearAll(){
  if(!confirm("确定清空所有数据？此操作不可恢复，建议先导出备份。"))return;
  DB = defaultDB();save();renderAll();
}

/* ============ 渲染入口 ============ */
function renderAll(){
  renderFramework();
  renderMarketLog();
  renderTrades();
  renderAnalysis();
  renderSettings();
}

/* ============ 启动 ============ */
initTheme();
initBinance();
setSyncBadge(null, "未配置");
renderAll();
// 异步恢复 Supabase 登录会话（不阻塞界面）
setTimeout(()=>sbInitOnLoad(), 80);
// 检测桥接数据（来自财务管家的卖出）
setTimeout(()=>checkBridgePending(), 120);

/* ============ 桥接接收：财务管家的卖出记录 → 导入到复盘表 ============ */
function checkBridgePending(){
  try{
    const raw = localStorage.getItem("ts_bridge");
    if(!raw) return;
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.pending) || data.pending.length===0) return;
    const list = data.pending;
    const lines = list.slice(0,5).map(it=>{
      const sign = it.pnl>=0?"+":"";
      return `· ${it.date||"?"} ${it.name||it.symbol} ${esc(it.direction||"做多")} pnl=${sign}${(+it.pnl||0).toFixed(2)} (提示策略:${esc(it.strategy_hint||"-")})`;
    }).join("\n");
    const more = list.length>5 ? `\n...还有 ${list.length-5} 笔` : "";
    if(!confirm("检测到来自「个人财务管家」的 "+list.length+" 笔卖出记录，是否导入到复盘表？\n\n"+lines+more+"\n\n（导入后会从队列里移除；填好策略/盈亏，你只需要补心态点评和教训）")) return;
    let imported = 0;
    list.forEach(it=>{
      const obj = {
        id: uid(),
        date: it.date || today(),
        market: it.market || "A股",
        symbol: it.symbol || "",
        name: it.name || it.symbol || "",
        direction: it.direction || "做多",
        cycle: it.cycle || "波段",
        strategy: it.strategy_hint || "其他",
        entryPrice: +it.entryPrice||0,
        exitPrice: +it.exitPrice||0,
        quantity: +it.quantity||0,
        pnl: +it.pnl||0,
        pnlPct: +it.pnlPct||0,
        result: (+it.pnl||0)>0?"盈利":(+it.pnl||0)<0?"亏损":"平手",
        execQuality: "到位",
        emotionNote: "",
        lesson: ""
      };
      // 简化公式：bridge 入库时 pnl 已折算为人民币，不要二次折算
      // 但如果 schema 有重复换算的风险，可以在这里加上 ¥ 注记
      DB.trades.push(obj);
      imported++;
    });
    localStorage.removeItem("ts_bridge");
    save();
    renderAll();
    showToast(`✓ 已导入 ${imported} 笔交易记录`);
    alert("已导入 "+imported+" 笔到「交易记录」页。请补一下「心态点评」和「教训」字段（这是最有价值的部分）。");
  }catch(e){ console.warn("bridge parse failed:", e); }
}
