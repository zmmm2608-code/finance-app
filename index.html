<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-page-node-id="Ee14Zs6C3j1gY1AG9t4qsk">
<head data-page-node-id="ODlMd0sUn24UFCOdJLm297">
<meta charset="UTF-8" data-page-node-id="GxOuCrSDBX5PD1wsfBxUhf">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="2kZ0Kv2YsJK2B167KMyjPt">
<title>个人财务管家</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f5f9; --card:#ffffff; --text:#1a1d26; --muted:#8a90a0; --border:#e7e9f0;
    --accent:#2563eb; --accent-soft:#eaf0ff;
    --up:#e0393b; --down:#12a150; --warn:#d97706;
    --shadow:0 1px 3px rgba(20,24,40,.06),0 1px 2px rgba(20,24,40,.04);
    --radius:14px;
  }
  html[data-theme="dark"]{
    --bg:#0f1117; --card:#181b24; --text:#e9ecf3; --muted:#8b90a0; --border:#262a37;
    --accent:#5b8cff; --accent-soft:#1c2438;
    --up:#ff5b5d; --down:#2fd27a; --warn:#f0a34b;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
  .num{font-variant-numeric:tabular-nums;font-weight:600}

  /* header */
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;
    padding:0 24px;height:60px;background:var(--card);border-bottom:1px solid var(--border);
  }
  .brand{font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap;cursor:pointer;user-select:none}
  .brand .logo{color:var(--accent)}
  nav{display:flex;gap:4px;flex:1;overflow-x:auto}
  nav button{
    border:none;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;
    color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;transition:.15s;
  }
  nav button:hover{color:var(--text);background:var(--accent-soft)}
  nav button.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
  .head-actions{display:flex;gap:8px;align-items:center}
  .sync-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--text);transition:all .15s}
  .sync-badge:hover{border-color:var(--accent)}
  .sync-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);position:relative;flex-shrink:0}
  .sync-badge .dot::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid currentColor;opacity:.18}
  .sync-badge.state-ok{color:var(--down)}
  .sync-badge.state-ok .dot{background:var(--down)}
  .sync-badge.state-saving{color:var(--accent)}
  .sync-badge.state-saving .dot{background:var(--accent);animation:pulse 1.1s infinite}
  .sync-badge.state-pending{color:#b45309;border-color:#fbbf24;background:#fffbeb}
  .sync-badge.state-pending .dot{background:#f59e0b}
  .sync-badge.state-error{color:var(--up);border-color:var(--up)}
  .sync-badge.state-error .dot{background:var(--up)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #savedToast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-50px);background:var(--down);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none}
  #savedToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--card);color:var(--text);padding:8px 13px;border-radius:9px;
    cursor:pointer;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.small{padding:5px 9px;font-size:12px}
  .btn.danger{background:var(--up);color:#fff;border-color:var(--up)}
  .btn.danger:hover{border-color:var(--up);color:var(--up)}
  .btn.sell{background:#fff7ed;color:#c2410c;border-color:#fed7aa;font-weight:600}
  .btn.sell:hover{background:#fed7aa;color:#9a3412}

  /* ============ 手机快速录入 ============ */
  .qa-wrap{max-width:560px;margin:0 auto;padding:14px 16px;min-height:60vh}
  .qa-amount-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 16px;margin-bottom:14px}
  .qa-amount-label{font-size:12px;color:var(--muted);margin-bottom:4px}
  .qa-amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--border);padding:6px 0 10px}
  .qa-amount .cny{font-size:22px;color:var(--muted)}
  .qa-amount input{flex:1;border:none;background:transparent;font-size:36px;font-weight:600;color:var(--text);outline:none;padding:0;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .qa-amount input::-webkit-outer-spin-button,.qa-amount input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qa-section-title{font-size:12px;color:var(--muted);margin:14px 4px 8px}
  .qa-chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 8px;scrollbar-width:none}
  .qa-chips::-webkit-scrollbar{display:none}
  .qa-chip{flex-shrink:0;border:1.5px solid var(--border);background:var(--card);color:var(--text);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;transition:.12s}
  .qa-chip:active{transform:scale(.96)}
  .qa-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .qa-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .qa-key{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 0;font-size:18px;font-weight:500;color:var(--text);cursor:pointer;user-select:none;transition:.1s;text-align:center}
  .qa-key:active{background:var(--accent-soft);transform:scale(.96)}
  .qa-key.ac{background:var(--bg);color:var(--muted)}
  .qa-save{display:block;width:100%;padding:16px;font-size:17px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:14px;margin-top:14px;cursor:pointer}
  .qa-save:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
  .qa-save:active:not(:disabled){filter:brightness(1.1)}
  .qa-extra{display:flex;gap:8px;align-items:center;margin-top:10px}
  .qa-extra input{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px}
  .qa-toggle-bar{display:flex;gap:6px;margin-bottom:14px}
  .qa-toggle{flex:1;text-align:center;padding:9px 0;border:1px solid var(--border);background:var(--card);border-radius:10px;font-size:13px;color:var(--muted);cursor:pointer}
  .qa-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
  .qa-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-50px);background:var(--down);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .qa-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 快速录入以浮层形式覆盖，避免任何渲染异常影响主应用 */
  .qa-overlay{display:none}
  body.qa-mode .qa-overlay{display:block;position:fixed;inset:0;background:var(--bg);z-index:80;overflow:auto;-webkit-overflow-scrolling:touch}
  body.qa-mode .qa-overlay .qa-close{position:fixed;top:14px;right:14px;z-index:81;background:var(--card);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--muted)}
  body.qa-mode .qa-overlay .qa-close:active{transform:scale(.95)}
  .btn.ghost{border:none;background:none;padding:6px 8px}

  main{padding:24px;max-width:1180px;margin:0 auto}
  section{display:none}
  section.active{display:block}

  /* cards & grid */
  .grid{display:grid;gap:16px}
  .g-stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .g-2{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.g-2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .card h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
  .stat .label{font-size:12px;color:var(--muted);margin-bottom:6px}
  .stat .value{font-size:22px;font-weight:700;letter-spacing:.2px}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:6px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 10px;text-align:right;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--border)}
  td{border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--accent-soft)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--accent-soft);color:var(--accent)}
  .tag.custody{background:#fef3e2;color:var(--warn)}
  .tag.self{background:#e8f7ee;color:var(--down)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg)}
  .seg button{padding:6px 10px;background:transparent;border:none;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:none}
  .seg button.active{background:var(--accent);color:#fff}
  .cur-tag{display:inline-block;padding:1px 6px;background:var(--accent-soft);color:var(--accent);border-radius:4px;font-size:11px;margin-left:4px;font-weight:600}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}

  input,select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;
    background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:10px}
  .empty p{margin-bottom:16px}

  /* modal */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal-head span{font-weight:600;font-size:15px}
  .modal-body{padding:20px}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px}

  /* legend */
  .legend{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .legend .row{display:flex;align-items:center;gap:8px;font-size:13px}
  .legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .legend .name{color:var(--muted)}
  .legend .val{margin-left:auto;font-weight:600}

  .notice{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:16px}
  .notice b{color:var(--accent)}

  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .kv{display:flex;gap:16px;flex-wrap:wrap}
  .kv .k{font-size:12px;color:var(--muted)}
  .kv .v{font-size:15px;font-weight:700}

  /* ============ 移动端适配 ============ */
  @media (max-width:720px){
    header{padding:10px 14px;height:auto;flex-wrap:wrap;gap:8px;align-items:center}
    .brand{font-size:15px}
    nav{order:4;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px;margin:0 -14px;padding-left:14px;padding-right:14px;gap:2px}
    nav::-webkit-scrollbar{height:0}
    nav button{padding:11px 13px;font-size:14px;flex-shrink:0}
    .head-actions{margin-left:auto;gap:6px}
    .btn{padding:9px 12px;font-size:13px}
    .btn.small{padding:8px 11px;font-size:12px}
    main{padding:14px}
    .card{padding:14px;border-radius:12px}
    .card h3{font-size:14px;margin-bottom:10px;flex-wrap:wrap;gap:8px}
    .stat .value{font-size:19px}
    .stat .label{font-size:11px}
    .stat .sub{font-size:11px}
    .g-stats{grid-template-columns:repeat(2,1fr);gap:10px}
    .g-2{grid-template-columns:1fr;gap:12px}
    .toolbar{gap:8px;margin-bottom:12px}
    .toolbar .btn{flex:1;justify-content:center}
    table{font-size:12px}
    th,td{padding:9px 7px}
    .modal-mask{padding:8px;align-items:stretch}
    .modal{border-radius:12px;max-width:100%}
    .modal-head{padding:12px 14px}
    .modal-body{padding:14px}
    .modal-foot{padding:0 14px 14px;gap:8px}
    .modal-foot .btn{flex:1;justify-content:center}
    .field{margin-bottom:10px}
    input,select,textarea{padding:10px 11px;font-size:15px}
    .donut-wrap{flex-direction:column;align-items:flex-start;gap:14px}
    .notice{padding:9px 12px;font-size:11px}
    .kv{gap:12px}
    .kv .v{font-size:14px}
  }
  @media (max-width:380px){
    .g-stats{grid-template-columns:1fr}
    .head-actions .btn:not(#btnRefresh){padding:8px 10px}
  }
</style>
</head>

<script>
"use strict";
/* ============ 常量与工具 ============ */
const LS_KEY = "pfm_data_v1";
const THEME_KEY = "pfm_theme";

const DEFAULT_CATEGORIES = ["房租","车险","餐饮","交通","购物","医疗","水电","通讯","娱乐","其他"];
const DEFAULT_SOURCES = ["工资","奖金","理财收益","兼职","其他"];
const COLORS = ["#2563eb","#12a150","#e0393b","#d97706","#8b5cf6","#0891b2","#db2777","#65a30d","#f59e0b","#64748b"];

const MARKET_CURRENCY = {"A股":"CNY","港股":"HKD","美股":"USD","加密货币":"CNY"};
const COIN_IDS = {
  BTC:"bitcoin",ETH:"ethereum",USDT:"tether",BNB:"binancecoin",SOL:"solana",XRP:"ripple",
  ADA:"cardano",DOGE:"dogecoin",AVAX:"avalanche-2",DOT:"polkadot",LINK:"chainlink",
  LTC:"litecoin",MATIC:"matic-network",POL:"polygon-ecosystem-token",TRX:"tron",
  TON:"the-open-network",SHIB:"shiba-inu",UNI:"uniswap",ATOM:"cosmos",XLM:"stellar",
  ETC:"ethereum-classic",FIL:"filecoin",BCH:"bitcoin-cash",NEAR:"near",APT:"aptos",
  ARB:"arbitrum",OP:"optimism",SUI:"sui",PEPE:"pepe",DAI:"dai",USDC:"usd-coin"
};

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function money(n,d){n=+n||0;const s=n<0?"-":"";return s+"¥"+Math.abs(n).toLocaleString("zh-CN",{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});}
function plain(n,d){n=+n||0;return n.toLocaleString("zh-CN",{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});}
function pct(n){n=+n||0;return (n>0?"+":"")+n.toFixed(2)+"%";}
function pnlClass(n){return n>0.00001?"up":(n<-0.00001?"down":"muted");}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ymOf(d){return d.slice(0,7);}
function thisMonth(){return today().slice(0,7);}

/* ============ 数据模型 ============ */
function defaultDB(){
  return {
    version:1,
    fx:{USD:7.15,HKD:0.92,updatedAt:null},
    cash:[],
    debt:[],
    holdings:[],
    expenses:[],
    incomes:[],
    expenseCategories:DEFAULT_CATEGORIES.slice(),
    incomeSources:DEFAULT_SOURCES.slice(),
    tradeLog:[]           // 买卖交易记录 {id,date,side,market,code,name,quantity,price,currency,fxUsed,avgCost,realizedPnl,realizedPnlSelf,realizedPnlCustody,selfRatio,custodian,custody}
  };
}
let DB = load();

/* ============ Supabase 云同步（状态与配置） ============ */
const SUPABASE_CFG_KEY = "pfm_supabase_cfg";     // { url, anonKey } 存 localStorage
const SUPABASE_TABLE = "user_data";
let sbClient = null;       // 浏览器端 supabase 客户端
let sbUser = null;          // 当前登录用户对象 { id, email }
let autoSyncTimer = null;   // 防抖定时器
const AUTO_SYNC_DELAY = 2000;

function sbGetCfg(){
  try{ return JSON.parse(localStorage.getItem(SUPABASE_CFG_KEY)) || {}; }catch(e){ return {}; }
}
function sbSetCfg(cfg){ localStorage.setItem(SUPABASE_CFG_KEY, JSON.stringify(cfg)); }
function sbClearCfg(){ localStorage.removeItem(SUPABASE_CFG_KEY); sbClient = null; }

async function sbEnsureClient(){
  if(sbClient) return sbClient;
  const { url, anonKey } = sbGetCfg();
  if(!url || !anonKey){ throw new Error("尚未配置 Supabase，请先在「设置 → 云同步」中保存 Project URL 与 anon key"); }

  sbClient = window.supabase.createClient(url, anonKey, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  return sbClient;
}

/* ============ 汇率与估值 ============ */
function fxRate(cur){
  if(cur==="HKD")return DB.fx.HKD||0.92;
  if(cur==="USD"||cur==="USDT")return DB.fx.USD||7.15;
  return 1;
}
function holdingValuation(h){
  const price = (h.lastPrice!=null&&h.lastPrice!=="")? +h.lastPrice : +h.costPrice;
  const rate = fxRate(h.currency);
  const mktVal = (+h.quantity||0)*price*rate;
  const cost = (+h.quantity||0)*(+h.costPrice||0)*rate;
  const pnl = mktVal-cost;
  const pnlPct = cost>0? pnl/cost*100 : 0;
  let selfRatio = 100;
  if(h.custody==="whole")selfRatio=0;
  else if(h.custody==="ratio")selfRatio=Math.min(100,Math.max(0,+h.selfRatio||0));
  return {
    price,rate,mktVal,cost,pnl,pnlPct,selfRatio,
    selfMkt:mktVal*selfRatio/100, selfCost:cost*selfRatio/100, selfPnl:pnl*selfRatio/100,
    custodyMkt:mktVal*(100-selfRatio)/100, custodyPnl:pnl*(100-selfRatio)/100
  };
}

function computeTotals(){
  const cashTotal = DB.cash.reduce((s,c)=>s+(+c.balance||0),0);
  const debtTotal = DB.debt.reduce((s,d)=>s+(+d.balance||0),0);
  let selfStock=0, custodyStock=0, selfPnl=0, custodyPnl=0, stockCost=0;
  let stockSelf=0, cryptoSelf=0;
  const byCustodian={};
  DB.holdings.forEach(h=>{
    const v=holdingValuation(h);
    selfStock+=v.selfMkt; custodyStock+=v.custodyMkt; selfPnl+=v.selfPnl; custodyPnl+=v.custodyPnl; stockCost+=v.selfCost;
    if(h.market==="加密货币")cryptoSelf+=v.selfMkt; else stockSelf+=v.selfMkt;
    if(h.custody!=="none"){
      const who = h.custodian||"未命名";
      byCustodian[who]=byCustodian[who]||{mkt:0,pnl:0};
      byCustodian[who].mkt+=v.custodyMkt; byCustodian[who].pnl+=v.custodyPnl;
    }
  });
  // 实现盈亏（从 tradeLog 计算，按归属拆分）
  const log = DB.tradeLog || [];
  let realizedSelf = 0, realizedCustody = 0;
  log.forEach(t=>{
    if(t.side!=="sell") return;
    realizedSelf   += (+t.realizedPnlSelf||0);
    realizedCustody += (+t.realizedPnlCustody||0);
  });
  const realizedTotal = realizedSelf + realizedCustody;
  const totalAssets = cashTotal+selfStock+realizedSelf;  // 已落袋的也计入资产
  const netWorth = totalAssets-debtTotal;
  const ym=thisMonth();
  const monthExpense=DB.expenses.filter(e=>e.date&&e.date.slice(0,7)===ym).reduce((s,e)=>s+(+e.amount||0),0);
  const monthIncome=DB.incomes.filter(e=>e.date&&e.date.slice(0,7)===ym).reduce((s,e)=>s+(+e.amount||0),0);
  return {cashTotal,debtTotal,selfStock,custodyStock,selfPnl,custodyPnl,stockCost,totalAssets,netWorth,monthExpense,monthIncome,monthBalance:monthIncome-monthExpense,stockSelf,cryptoSelf,byCustodian,realizedSelf,realizedCustody,realizedTotal};
}

// 某只持仓（按 market+code 识别）累计已落袋实现盈亏
function realizedPnlForHolding(h){
  const k = h.market + "|" + h.code;
  let self = 0, custody = 0;
  (DB.tradeLog||[]).forEach(t=>{
    if(t.side!=="sell") return;
    if((t.market+"|"+t.code)!==k) return;
    self   += (+t.realizedPnlSelf||0);
    custody += (+t.realizedPnlCustody||0);
  });
  return {self, custody, total: self+custody};
}

/* ============ 行情更新 ============ */
function getSecid(h){
  if(h.market==="A股"){
    const c=h.code.trim();
    const m=/^[69]/.test(c)?"1":"0";
    return m+"."+c;
  }
  if(h.market==="港股")return "116."+h.code.trim().padStart(5,"0");
  if(h.market==="美股")return (h.exchange||"105")+"."+h.code.trim().toUpperCase();
  return null;
}
async function refreshFx(){
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/CNY",{cache:"no-store"});
    const j=await r.json();
    if(j&&j.result==="success"&&j.rates&&j.rates.USD&&j.rates.HKD){
      DB.fx.USD=+(1/j.rates.USD).toFixed(4);
      DB.fx.HKD=+(1/j.rates.HKD).toFixed(4);
      DB.fx.updatedAt=Date.now();
    }
  }catch(e){}
}
async function refreshStocks(){
  const list=DB.holdings.filter(h=>h.market!=="加密货币");
  await Promise.all(list.map(async h=>{
    const secid=getSecid(h);
    if(!secid){h.quoteError=true;return;}
    try{
      const r=await fetch("https://push2.eastmoney.com/api/qt/stock/get?secid="+secid+"&fltt=2&invt=2&fields=f43,f58,f170",{cache:"no-store"});
      const j=await r.json();
      if(j&&j.data&&j.data.f43!=null&&isFinite(j.data.f43)&&j.data.f43>0){
        h.lastPrice=+j.data.f43;
        if(j.data.f58)h.name=j.data.f58;
        h.lastUpdatedAt=Date.now();
        h.quoteError=false;
      }else{h.quoteError=true;}
    }catch(e){h.quoteError=true;}
  }));
}
async function refreshCrypto(){
  const cryptos=DB.holdings.filter(h=>h.market==="加密货币");
  if(!cryptos.length)return;
  const ids=cryptos.map(h=>COIN_IDS[h.code.trim().toUpperCase()]).filter(Boolean);
  if(!ids.length){cryptos.forEach(h=>h.quoteError=true);return;}
  try{
    const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids="+ids.join(",")+"&vs_currencies=cny",{cache:"no-store"});
    const j=await r.json();
    cryptos.forEach(h=>{
      const id=COIN_IDS[h.code.trim().toUpperCase()];
      if(id&&j[id]&&j[id].cny!=null){
        h.lastPrice=+j[id].cny;
        h.lastUpdatedAt=Date.now();
        h.quoteError=false;
      }else{h.quoteError=true;}
    });
  }catch(e){cryptos.forEach(h=>h.quoteError=true);}
}
let refreshing=false;
async function refreshQuotes(silent){
  if(refreshing)return;
  refreshing=true;
  const btn=document.getElementById("btnRefresh");
  if(btn)btn.textContent="⏳ 更新中…";
  try{
    await refreshFx();
    await refreshStocks();
    await refreshCrypto();
    save();
  }catch(e){}
  refreshing=false;
  if(btn)btn.textContent="↻ 刷新行情";
  renderAll();
  if(!silent)toast("行情已更新");
}
function toast(msg){
  const el=document.createElement("div");
  el.textContent=msg;
  el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

function expenseCategoryData(ym){
  const map={};
  DB.expenses.filter(e=>e.date&&e.date.slice(0,7)===ym).forEach(e=>{
    const c=e.category||"其他";
    map[c]=(map[c]||0)+(+e.amount||0);
  });
  const arr=Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
  arr.forEach((d,i)=>d.color=COLORS[i%COLORS.length]);
  return arr;
}
function trendBars(){
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    months.push({ym,label:(d.getMonth()+1)+"月"});
  }
  const data=months.map(m=>({
    label:m.label,
    inc:DB.incomes.filter(e=>e.date&&e.date.slice(0,7)===m.ym).reduce((s,e)=>s+(+e.amount||0),0),
    exp:DB.expenses.filter(e=>e.date&&e.date.slice(0,7)===m.ym).reduce((s,e)=>s+(+e.amount||0),0)
  }));
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const W=280,H=150;
  let bars="";
  const bw=W/data.length;
  data.forEach((d,i)=>{
    const cx=i*bw+bw/2;
    const ih=d.inc/max*(H-24), eh=d.exp/max*(H-24);
    bars+=`<rect x="${cx-bw*0.18}" y="${H-8-ih}" width="${bw*0.32}" height="${ih}" rx="3" fill="#2563eb" opacity="0.85"/>`;
    bars+=`<rect x="${cx-bw*0.18+bw*0.36}" y="${H-8-eh}" width="${bw*0.32}" height="${eh}" rx="3" fill="#e0393b" opacity="0.85"/>`;
    bars+=`<text x="${cx}" y="${H+6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.label}</text>`;
  });
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <svg viewBox="0 0 ${W} ${H+16}" width="100%" style="max-width:${W}px">${bars}</svg>
    <div class="legend" style="margin-top:0">
      <div class="row"><span class="dot" style="background:#2563eb"></span><span class="name">收入</span></div>
      <div class="row"><span class="dot" style="background:#e0393b"></span><span class="name">支出</span></div>
    </div></div>`;
}
function donutSVG(data){
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const R=46,C=2*Math.PI*R;
  let off=0,segs="";
  data.forEach(d=>{
    const frac=d.value/total;
    const dash=frac*C;
    segs+=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${d.color}" stroke-width="20" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off+=dash;
  });
  return `<div class="donut-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120">${segs}</svg>
    <div style="font-size:13px;color:var(--muted)">合计<br><span style="font-size:20px;font-weight:700;color:var(--text)">${money(total)}</span></div>
  </div>`;
}
function legendHTML(data){
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  return `<div class="legend">${data.map(d=>`
    <div class="row"><span class="dot" style="background:${d.color}"></span>
    <span class="name">${esc(d.label)}</span>
    <span class="val">${money(d.value)} · ${(d.value/total*100).toFixed(1)}%</span></div>`).join("")}</div>`;
}

// 生成可切换币种的价格输入框（成本 / 现价共用）
function renderPriceField(prefix, baseCur, value, canToggleCny, isLastPrice){
  const labelText = isLastPrice
    ? `现价 <span class="cur-tag" id="f_${prefix}Price_cur_tag">${baseCur}</span><span class="hint" style="display:inline;margin-left:6px">留空则自动获取行情</span>`
    : `成本价 <span class="cur-tag" id="f_${prefix}Price_cur_tag">${baseCur}</span>`;
  const toggle = canToggleCny ? `
    <div class="seg" id="f_${prefix}Price_seg">
      <button type="button" data-cur="${baseCur}" class="active" onclick="switchPriceCur('${prefix}','${baseCur}')">${baseCur}</button>
      <button type="button" data-cur="CNY" onclick="switchPriceCur('${prefix}','CNY')">CNY</button>
    </div>` : "";
  return `
    <label>${labelText}</label>
    <div style="display:flex;gap:6px;align-items:stretch;flex-wrap:wrap">
      <input name="${prefix==='cost'?'costPrice':'lastPrice'}" id="f_${prefix}Price" type="number" step="any" value="${value}" placeholder="0.00"
             style="flex:1;min-width:120px" data-base-cur="${baseCur}" data-cur="${baseCur}" ${canToggleCny?'oninput="updatePriceHint(\''+prefix+'\')"':''}>
      ${toggle}
    </div>
    <div class="hint" id="f_${prefix}Price_hint" style="min-height:14px"></div>`;
}

// 切换价格字段的输入币种，自动换算并显示对端值
function switchPriceCur(prefix, targetCur){
  const input = document.getElementById("f_"+prefix+"Price");
  if(!input) return;
  const baseCur = input.dataset.baseCur;
  const currentCur = input.dataset.cur;
  if(targetCur === currentCur) return;
  if(targetCur !== baseCur && targetCur !== "CNY") return;
  const val = parseFloat(input.value);
  if(!isNaN(val) && val > 0){
    let newVal;
    if(currentCur === "CNY" && targetCur === baseCur){
      // CNY → 市场币种：除以该币种对人民币的汇率
      newVal = val / fxRate(baseCur);
    } else if(currentCur === baseCur && targetCur === "CNY"){
      // 市场币种 → CNY：乘以汇率
      newVal = val * fxRate(baseCur);
    }
    if(newVal!=null) input.value = Number(newVal.toFixed(4));
  }
  input.dataset.cur = targetCur;
  // 更新按钮状态
  const seg = document.getElementById("f_"+prefix+"Price_seg");
  if(seg){
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.cur === targetCur));
  }
  // 更新币种标签
  const tag = document.getElementById("f_"+prefix+"Price_cur_tag");
  if(tag) tag.textContent = targetCur;
  updatePriceHint(prefix);
}

// 即时显示对端币种估算，仅 HK / US 市场显示
function updatePriceHint(prefix){
  const input = document.getElementById("f_"+prefix+"Price");
  const hint = document.getElementById("f_"+prefix+"Price_hint");
  if(!input || !hint) return;
  const baseCur = input.dataset.baseCur;
  const currentCur = input.dataset.cur;
  if(currentCur !== "CNY" && currentCur !== baseCur) return;
  const val = parseFloat(input.value);
  if(isNaN(val) || val <= 0){ hint.textContent = ""; return; }
  if(currentCur === baseCur){
    hint.textContent = `≈ ¥ ${(val * fxRate(baseCur)).toFixed(2)} 人民币`;
  } else {
    hint.textContent = `≈ ${baseCur} ${(val / fxRate(baseCur)).toFixed(4)}（存储为该币种）`;
  }
}
function stockMarketChange(){
  const m=document.getElementById("f_market").value;
  document.getElementById("f_exchange_wrap").style.display = m==="美股"?"block":"none";
  const cur=MARKET_CURRENCY[m];
  // 同步两个价格输入的基准币种
  ["cost","last"].forEach(prefix=>{
    const input = document.getElementById("f_"+prefix+"Price");
    if(!input) return;
    input.dataset.baseCur = cur;
    input.dataset.cur = cur;
    input.value = "";
    const tag = document.getElementById("f_"+prefix+"Price_cur_tag");
    if(tag) tag.textContent = cur;
    const seg = document.getElementById("f_"+prefix+"Price_seg");
    if(seg){
      seg.querySelectorAll("button").forEach(b=>{
        const isMarket = b.dataset.cur===cur;
        b.style.display = (m==="港股"||m==="美股") ? "inline-block" : "none";
        b.classList.toggle("active", isMarket);
      });
    }
    const hint = document.getElementById("f_"+prefix+"Price_hint");
    if(hint) hint.textContent = "";
  });
  document.getElementById("f_code").placeholder = m==="A股"?"如 600000":m==="港股"?"如 00700":m==="美股"?"如 AAPL":"如 BTC";

function custodyChange(){

function saveStock(idx){
  const f=id=>document.getElementById(id).value.trim();
  const market=f("f_market");
  const code=f("f_code");
  if(!code){alert("请填写代码/符号");return;}
  const baseCur = MARKET_CURRENCY[market];
  // 成本价：若当前以 CNY 显示，换算到市场币种再保存
  const costInput = document.getElementById("f_costPrice");
  const costCur = costInput.dataset.cur || baseCur;
  const costRaw = parseFloat(costInput.value)||0;
  const costPrice = (costCur === "CNY" && costRaw > 0) ? +(costRaw / fxRate(baseCur)).toFixed(4) : costRaw;
  // 现价同上
  const lastInput = document.getElementById("f_lastPrice");
  const lastCur = lastInput.dataset.cur || baseCur;
  const lastRaw = lastInput.value===""? null : parseFloat(lastInput.value);
  const lastPrice = (lastCur === "CNY" && lastRaw!=null && lastRaw > 0) ? +(lastRaw / fxRate(baseCur)).toFixed(4) : lastRaw;

  const obj={
    market,
    code,
    name:f("f_name")||code,
    exchange:f("f_exchange")||"105",
    quantity:parseFloat(f("f_quantity"))||0,
    costPrice,
    currency:baseCur,
    custody:f("f_custody"),
    custodian:f("f_custodian"),
    selfRatio:parseFloat(f("f_selfRatio"))||100,
    lastPrice
  };
  if(obj.custody==="none")obj.selfRatio=100;
  if(obj.custody==="whole")obj.selfRatio=0;
  if(idx!=null){DB.holdings[idx]=Object.assign(DB.holdings[idx],obj);}
  else{obj.lastUpdatedAt=null;DB.holdings.push(obj);}
  save();closeModal();renderAll();
}
function delStock(idx){

      </div>

    const p = document.getElementById("sell_price");
    const calc = ()=>{
      const qn = parseFloat(q.value)||0;
      const pn = parseFloat(p.value)||0;
      const total = qn*pn;
      const avgCost = h.costPrice||0;
      const perSharePnl = pn - avgCost;
      const realized = qn * perSharePnl;
      const fxRate = (h.market==="港股"? DB.fx.HKD : (h.market==="美股"? DB.fx.USD : 1)) || 1;
      const realizedCny = realized * fxRate;
      const selfRatio = h.custody==="none" ? 100 : (h.custody==="whole" ? 0 : (+h.selfRatio||100));
      const realizedSelf = realizedCny * selfRatio/100;
      const realizedCustody = realizedCny - realizedSelf;
      document.getElementById("sell_totalPreview").value = total ? (total.toFixed(2)+" "+cur) : "";
      const html = (qn>0 && pn>0) ?

        : "卖出后实现盈亏（含归属）会自动显示";
      document.getElementById("sell_pnl_preview").innerHTML = html;
    };
    q.addEventListener("input", calc);
    p.addEventListener("input", calc);
    calc();
  }, 50);
}

function saveSellStock(idx){
  const h=DB.holdings[idx];
  if(!h) return;
  const date = document.getElementById("sell_date").value;
  const quantity = parseFloat(document.getElementById("sell_quantity").value);
  const price = parseFloat(document.getElementById("sell_price").value);
  if(!date){alert("请选择卖出日期");return;}
  if(!quantity || quantity<=0){alert("卖出数量必须大于0");return;}
  if(price<0){alert("卖出价格无效");return;}
  const maxQty = +h.quantity || 0;
  if(quantity > maxQty + 1e-9){
    if(!confirm("卖出数量("+quantity+")超过当前持仓("+maxQty+")。继续将以超出计算，确定吗？"))return;
  }
  const avgCost = +h.costPrice || 0;
  const fxKey = h.market==="港股"?"HKD":(h.market==="美股"?"USD":"CNY");
  const fxRate = (h.market==="A股"||h.market==="加密货币") ? 1 : ((DB.fx[fxKey])||1);
  const perSharePnl = price - avgCost;     // 原币种盈亏
  const realized = quantity * perSharePnl; // 原币种总盈亏
  const realizedCny = realized * fxRate;   // 折算人民币
  const selfRatio = h.custody==="none" ? 100 : (h.custody==="whole" ? 0 : (+h.selfRatio||100));
  const realizedSelf = realizedCny * selfRatio/100;
  const realizedCustody = realizedCny - realizedSelf;
  // 记录交易
  DB.tradeLog = DB.tradeLog || [];
  DB.tradeLog.push({
    id: "trade-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
    side: "sell",
    date, market:h.market, code:h.code, name:h.name||h.code,
    quantity, price,
    currency: h.currency || MARKET_CURRENCY[h.market],
    fxUsed: fxRate,
    avgCost,
    realizedPnl: +realizedCny.toFixed(2),
    realizedPnlSelf: +realizedSelf.toFixed(2),
    realizedPnlCustody: +realizedCustody.toFixed(2),
    selfRatio, custodian: h.custodian||"",
    custody: h.custody
  });
  // 减少持仓
  h.quantity = Math.max(0, (+h.quantity||0) - quantity);
  save();
  closeModal();
  renderAll();
  // 弹反馈
  const closed = (+h.quantity)<=0;
  if(closed){
    setTimeout(()=>alert("已卖出全部持仓，"+h.name+" 已清仓。\n\n实现盈亏："+(realizedCny>=0?"+":"")+money(realizedCny)+"\n（已计入净资产，看板「股票」卡片会反映）"), 50);
  }else{
    setTimeout(()=>alert("卖出成功。\n剩余持仓："+plain(h.quantity)+(h.market==="加密货币"?"枚":"股")+"，\n本次实现盈亏："+(realizedCny>=0?"+":"")+money(realizedCny)),50);
  }
  // 桥接到个人交易系统复盘
  const bridge = (confirm("是否把这笔卖出同步到「个人交易系统」复盘记录？\n（仅同步本笔交易的关键信息：日期/标的/盈亏/策略提示；交易系统那边再补心态点评与教训）")) ? true : false;
  if(bridge) bridgeToTradeSystem({
    date, market:h.market, symbol:h.code, name:h.name||h.code,
    direction:"做多",     // A股/港股/美股都按 T+1 长期持有视为做多；用户可在交易系统里改
    cycle:"波段",
    entryPrice: avgCost, exitPrice: price, quantity,
    pnl: +realizedCny.toFixed(2),
    pnlPct: avgCost>0 ? ((price-avgCost)/avgCost*100) : 0,
    strategy_hint: h.custody==="whole" ? "代持止盈" : (h.custody==="ratio" ? "部分代持止盈" : "趋势突破止盈"),
    custody: h.custody, selfRatio, custodian: h.custodian||""
  });
}

/* ============ 桥接：卖出 → 交易系统复盘预填 ============ */
const BRIDGE_KEY = "ts_bridge";
function bridgeToTradeSystem(item){
  try{
    const raw = localStorage.getItem(BRIDGE_KEY);
    const data = raw ? JSON.parse(raw) : {pending:[]};
    data.pending = data.pending || [];
    data.pending.push(Object.assign({id:"bridge-"+Date.now()+"-"+Math.random().toString(36).slice(2,6), source:"finance", createdAt:Date.now()}, item));
    localStorage.setItem(BRIDGE_KEY, JSON.stringify(data));
    // 财务管家端没有 showToast，用 alert 兜底
    if(typeof showSavedToast === "function") showSavedToast("✓ 已推送到复盘队列");
  }catch(e){ console.warn("bridge failed:", e); alert("桥接失败："+e.message); }
}

  DB.expenses.forEach(e=>{const c=e.category||"其他";map[c]=(map[c]||0)+(+e.amount||0);});
  const arr=Object.entries(map).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  if(!arr.length)return '<p class="muted">暂无支出</p>';
  const max=Math.max(...arr.map(a=>a.v));
  return `<div class="legend" style="margin-top:0">${arr.map((a,i)=>`
    <div>
      <div class="row" style="margin-bottom:4px"><span class="name">${esc(a.k)}</span><span class="val">${money(a.v)}</span></div>
      <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;width:${(a.v/max*100).toFixed(1)}%;background:${COLORS[i%COLORS.length]}"></div></div>

}

/* ============ 手机快速录入 ============ */
const isMobile = ()=> {
  try{
    const ua = (navigator&&navigator.userAgent)||"";
    if(/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) return true;
    if(window.matchMedia && typeof window.matchMedia === "function"){
      try{ return !!window.matchMedia("(pointer:coarse)").matches; }catch(e){ return false; }
    }
  }catch(e){}
  return false;
};
function quickAddKey(key){
  const input = document.getElementById("qa_amount");
  if(!input) return;
  const cur = (input.value||"").toString();
  if(key==="AC"){ input.value=""; }
  else if(key==="⌫"){ input.value = cur.slice(0,-1); }
  else if(key==="."){
    if(!cur.includes(".")) input.value = cur + ".";
  }else{
    // 限制两位小数
    if(cur.includes(".")){
      const [int,dec] = cur.split(".");
      if(dec.length>=2) return;
    }
    input.value = cur + key;
  }
  updateQuickAddPreview();
}
function selectQuickCategory(cat){
  document.querySelectorAll(".qa-chip").forEach(c=>c.classList.toggle("active", c.dataset.cat===cat));
  document.getElementById("qa_selected_cat").value = cat;
  updateQuickAddPreview();
}
function updateQuickAddPreview(){
  const v = parseFloat(document.getElementById("qa_amount").value||0);
  document.getElementById("qa_preview").textContent = v>0 ? ("¥ "+v.toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})) : "¥ 0.00";
  document.getElementById("qa_save").disabled = !(v>0);
}
function saveQuickExpense(){
  const amount = parseFloat(document.getElementById("qa_amount").value);
  const category = document.getElementById("qa_selected_cat").value;
  const note = document.getElementById("qa_note").value.trim();
  if(!(amount>0) || !category){ alert("请填写金额并选择分类"); return; }
  const obj = {date: today(), category, amount:+amount.toFixed(2), note};
  DB.expenses.push(obj);
  save();
  // 重置
  document.getElementById("qa_amount").value = "";
  document.getElementById("qa_note").value = "";
  updateQuickAddPreview();
  // 反馈
  const t = document.getElementById("qaToast");
  if(t){ t.textContent = "✓ 已记：¥ "+amount.toFixed(2)+" · "+category; t.classList.add("show"); clearTimeout(window._qaToastTimer); window._qaToastTimer = setTimeout(()=>t.classList.remove("show"),1600); }
}
function enterQuickAdd(){
  renderQuickAdd();  // 每次进入都重新渲染浮层
  document.body.classList.add("qa-mode");
  // 默认选中第一个分类
  setTimeout(()=>{
    const first = document.querySelector(".qa-chip");
    if(first) selectQuickCategory(first.dataset.cat);
    const amt = document.getElementById("qa_amount");
    if(amt) amt.focus({preventScroll:true});
  }, 50);
}
function exitQuickAdd(){
  document.body.classList.remove("qa-mode");
}
function maybeAutoShowQuickAdd(){
  // 仅首次在移动端打开时弹一次，自动进入快速录入
  if(!isMobile()) return;
  const key = "qa_dismissed_v1";
  if(localStorage.getItem(key)==="1") return;
  // 询问一次
  if(confirm("是否进入【快速记一笔】模式？\n（随时点顶部标题可退出，再点可重新进入）")){
    enterQuickAdd();
  }else{
    localStorage.setItem(key,"1");
  }
}

function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="个人财务备份_"+today()+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input){
  const file=input.files[0];
  if(!file)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      DB=Object.assign(defaultDB(),d);
      save();renderAll();
      toast("导入成功");
    }catch(e){alert("文件格式错误，导入失败");}
  };
  r.readAsText(file);
  input.value="";
}

/* ============ Modal 通用 ============ */
function openModal(title,bodyHTML,onSave,saveLabel="保存",saveClass="primary"){
  document.getElementById("modal-root").innerHTML=`
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head"><span>${esc(title)}</span><button class="btn ghost" onclick="closeModal()">✕</button></div>
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-foot">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn ${saveClass}" onclick="document._modalSave()">${esc(saveLabel)}</button>
        </div>
      </div>
    </div>`;
  document._modalSave=onSave;
}
function closeModal(){document.getElementById("modal-root").innerHTML="";document._modalSave=null;}

function openAuthModal(mode /* 'login' | 'register' */){
  const title = mode==="register" ? "注册新账号" : "登录";
  const tip = mode==="register"
    ? "首次注册会创建一个新账号。密码至少 6 位。"
    : "输入已注册的邮箱与密码。";
  openModal(title, `
    <p class="muted" style="margin-bottom:14px;font-size:13px">${tip}</p>
    <div class="field"><label>邮箱</label><input id="sb_email" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>密码</label><input id="sb_pwd" type="password" autocomplete="${mode==="register"?"new-password":"current-password"}" placeholder="至少 6 位"></div>
    <p id="sb_auth_msg" class="muted" style="font-size:12px;margin-top:6px"></p>`,
    async ()=>{
      const email = (document.getElementById("sb_email").value||"").trim();
      const password = document.getElementById("sb_pwd").value||"";
      const msg = document.getElementById("sb_auth_msg");
      msg.style.color = "var(--muted)"; msg.textContent = mode==="register" ? "注册中..." : "登录中...";
      if(!email || !password){ msg.style.color="var(--up)"; msg.textContent="请填写邮箱和密码"; return; }
      if(password.length < 6){ msg.style.color="var(--up)"; msg.textContent="密码至少 6 位"; return; }
      let client;
      try{ client = await sbEnsureClient(); }
      catch(e){ msg.style.color="var(--up)"; msg.textContent=e.message; return; }
      let res, err;
      if(mode==="register"){
        res = await client.auth.signUp({email, password});
      }else{
        res = await client.auth.signInWithPassword({email, password});
      }
      err = res.error;
      if(err){
        msg.style.color="var(--up)"; msg.textContent = err.message;
        return;
      }
      // 登录/注册成功
      sbUser = (res.data && res.data.user) || null;
      if(!sbUser){ msg.style.color="var(--warn)"; msg.textContent="未返回用户对象，请检查 Supabase 控制台邮箱确认设置。"; return; }
      setSyncBadge("ok", "已登录");
      // 检查云端数据情况
      const localNonEmpty = (DB.holdings.length + DB.expenses.length + DB.incomes.length + DB.cash.length + DB.debt.length) > 0;
      closeModal();
      await reconcileAfterLogin(localNonEmpty);
      renderSettings();
    },
    mode==="register" ? "注册" : "登录",
    "primary");
  setTimeout(()=>document.getElementById("sb_email")?.focus(), 60);
}

async function cloudLogout(){
  if(!sbClient) return;
  if(!confirm("退出登录后，本设备的数据仍保留。确定退出？")) return;
  try{ await sbClient.auth.signOut(); }catch(e){}
  sbUser = null;
  setSyncBadge(null, "未登录");
  renderSettings();
}

async function sbWaitForUser(){
  // signIn 之后 auth.user 会在下一次 tick 才更新，主动检查 session
  try{
    const { data } = await sbClient.auth.getSession();
    return (data && data.session && data.session.user) || null;
  }catch(e){ return null; }
}

async function sbLoadRow(){
  // 把当前 user 的 data 拉回来，文件不存在返回 null
  if(!sbUser){ sbUser = await sbWaitForUser(); }
  if(!sbUser) return null;
  const { data, error } = await sbClient.from(SUPABASE_TABLE).select("data").eq("user_id", sbUser.id).maybeSingle();
  if(error){ console.warn("sbLoadRow:", error); return null; }
  return data ? data.data : null;
}

async function sbSaveRow(payload){
  if(!sbUser){ sbUser = await sbWaitForUser(); }
  if(!sbUser) throw new Error("未登录");
  const { error } = await sbClient.from(SUPABASE_TABLE).upsert({
    user_id: sbUser.id,
    data: payload,
    updated_at: new Date().toISOString()
  });
  if(error) throw error;
}

async function sbDeleteRow(){
  if(!sbUser) throw new Error("未登录");
  const { error } = await sbClient.from(SUPABASE_TABLE).delete().eq("user_id", sbUser.id);
  if(error) throw error;
}

// 一键清空云端并重新上传完整本地数据（用于修复老 schema=1 数据污染）
async function cloudResetAndPush(){
  if(!confirm("⚠️ 这个操作会清空云端原有数据，然后用本设备的完整数据重新上传。\n\n继续前请确认：\n ① 本设备「看板 → 净资产」数字是正常的\n ② 数据里有持仓数量、代持人、汇率等\n\n如果另一台设备数据不正确，登录后会从这台拉取。\n\n确定继续？")) return;
  try{
    sbClient = await sbEnsureClient();
    if(!sbUser){ sbUser = await sbWaitForUser(); }
    if(!sbUser){ alert("请先登录"); return; }
    setSyncBadge("saving", "重置中…");
    await sbDeleteRow();
    await sbSaveRow(dbToCloudPayload());
    setSyncStatus("云端已重置并重新上传 ✅");
    setSyncBadge("ok", "已同步");
    alert("云端已清空并用本设备的完整数据覆盖。\n\n下一步：在另一台设备上强制刷新页面 → 设置 → 云同步 → 点「从云拉取覆盖本地」。");
  }catch(e){
    setSyncStatus("重置失败: " + e.message, true);
    setSyncBadge("error", "重置失败");
    alert("重置失败：" + e.message);
  }
}

function dbToCloudPayload(){
  // 全字段透传，不要人工挑选字段（之前的版本漏了 quantity/custody/currency 等）
  const o = JSON.parse(JSON.stringify(DB));
  o._meta = { schema: 2, savedAt: Date.now() };
  // 顺带清掉本地临时状态：未持久化的 quoteError
  o.holdings.forEach(h => { delete h.quoteError; });
  return o;
}

function cloudPayloadToDB(p){
  // 把云端 payload 安全合并到 DB（保留本地的临时字段）
  if(!p) return;
  // 兼容旧 schema（schema=1 时 shares/custType 是错的，被旧版推送的）
  let holdings = p.holdings || [];
  if(p._meta && p._meta.schema === 1){
    holdings = holdings.map(h => {
      const custody = h.custody ?? h.custType ?? "none";
      return {
        ...h,
        quantity: h.quantity ?? h.shares ?? 0,
        custody,
        lastUpdatedAt: h.lastUpdatedAt ?? h.priceUpdatedAt ?? null,
        currency: h.currency ?? MARKET_CURRENCY[h.market] ?? "CNY",
        exchange: h.exchange ?? (h.market==="美股"?"105":""),
        selfRatio: h.selfRatio != null ? h.selfRatio : (custody === "whole" ? 0 : (custody === "none" ? 100 : 100)),
        custodian: h.custodian ?? "",
        name: h.name || h.code || ""
      };
    });
  }
  DB = Object.assign(defaultDB(), {
    holdings: holdings,
    cash: p.cash || [],
    debt: p.debt || [],
    expenseCategories: p.expenseCategories && p.expenseCategories.length ? p.expenseCategories : DB.expenseCategories,
    expenses: p.expenses || [],
    incomeSources: p.incomeSources && p.incomeSources.length ? p.incomeSources : DB.incomeSources,
    incomes: p.incomes || [],
    tradeLog: p.tradeLog || [],
    fx: p.fx || DB.fx
  });
  DB.expenseCategories = DB.expenseCategories.length ? DB.expenseCategories : DEFAULT_CATEGORIES.slice();
  DB.incomeSources = DB.incomeSources.length ? DB.incomeSources : DEFAULT_SOURCES.slice();
}

function setSyncStatus(txt, isErr){
  // 旧的设置页角标
  const el = document.getElementById("syncStatus");
  if(el){ el.style.color = isErr ? "var(--up)" : "var(--down)"; el.textContent = txt ? (" · " + txt) : ""; }
  // 同时更新顶部徽章
  if(!txt){ setSyncBadge(null, "已登录"); }
  else if(isErr){ setSyncBadge("error", txt.replace(/^.+?: /, "失败 ").slice(0, 18)); }
  else if(txt.includes("✅") || txt.includes("已")){ setSyncBadge("ok", "已同步"); }
  else{ setSyncBadge("saving", txt.replace(/^.+?: /, "").slice(0, 18)); }
}

async function cloudPushNow(){
  try{
    sbClient = await sbEnsureClient();
    if(!sbUser){ sbUser = await sbWaitForUser(); }
    if(!sbUser){ alert("请先登录"); return; }
    setSyncStatus("推送中...");
    await sbSaveRow(dbToCloudPayload());
    setSyncStatus("已推送 ✅");
    save();
  }catch(e){ setSyncStatus("失败: " + e.message, true); alert("推送失败: " + e.message); }
}

async function cloudPullNow(){
  if(!confirm("从云拉取将覆盖当前浏览器内的本地数据（同步前自动备份一份）。继续？")) return;
  // 先本地备份
  exportDataSilent();
  try{
    sbClient = await sbEnsureClient();
    if(!sbUser){ sbUser = await sbWaitForUser(); }
    if(!sbUser){ alert("请先登录"); return; }
    setSyncStatus("拉取中...");
    const remote = await sbLoadRow();
    if(remote==null){
      setSyncStatus("云端无数据", false);
      alert("云端尚无数据，无需拉取。");
      return;
    }
    cloudPayloadToDB(remote);
    save(); renderAll();
    setSyncStatus("已拉取 ✅");
    alert("已从云端拉取并覆盖本地。");
  }catch(e){ setSyncStatus("失败: " + e.message, true); alert("拉取失败: " + e.message); }
}

function exportDataSilent(){
  // 用于拉取前的静默备份
  try{
    const blob = new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data:DB}, null, 2)], {type:"application/json"});
    const ts = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `backup_before_pull_${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){ console.warn("silent backup failed", e); }
}

async function reconcileAfterLogin(localNonEmpty){
  // 登录后询问合并策略
  let remote = null;
  try{ remote = await sbLoadRow(); }
  catch(e){ console.warn(e); }
  const remoteEmpty = !remote || (
    (!remote.holdings || !remote.holdings.length) &&
    (!remote.expenses  || !remote.expenses.length) &&
    (!remote.incomes   || !remote.incomes.length) &&
    (!remote.cash      || !remote.cash.length) &&
    (!remote.debt      || !remote.debt.length)
  );

  if(remoteEmpty && localNonEmpty){
    if(confirm("云端无数据。是否把当前浏览器内的本地数据推到云端？\n（取消则只登录查看，不上传）")){
      await sbSaveRow(dbToCloudPayload());
      alert("本地数据已推到云端 ✅");
    }else{
      // 只登录不上传
    }
  } else if(!remoteEmpty && !localNonEmpty){
    if(confirm("云端已有数据，本地为空。是否拉取到本设备？")){
      cloudPayloadToDB(remote);
      save(); renderAll();
    }
  } else if(!remoteEmpty && localNonEmpty){
    const choice = prompt(
      "本地与云端都有数据。请选择处理方式：\n" +
      "1 - 用本地覆盖云端（保留本地最新编辑）\n" +
      "2 - 用云端覆盖本地（拉到本设备）\n" +
      "3 - 暂不处理，先登录\n" +
      "输入 1/2/3："
    );
    if(choice === "1"){
      await sbSaveRow(dbToCloudPayload());
      alert("已用本地覆盖云端 ✅");
    }else if(choice === "2"){
      exportDataSilent();
      cloudPayloadToDB(remote);
      save(); renderAll();
      alert("已用云端覆盖本地（已自动备份原数据）");
    }else{
      // 不处理
    }
  }
}

function queueAutoSync(){
  if(!sbClient || !sbUser) return;
  setSyncBadge("pending", "待同步");
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(async ()=>{
    setSyncBadge("saving", "同步中...");
    try{
      await sbSaveRow(dbToCloudPayload());
      setSyncStatus("自动同步 ✅ " + new Date().toLocaleTimeString());
    }catch(e){
      setSyncStatus("自动同步失败: " + e.message, true);
      setSyncBadge("error", "同步失败");
    }
  }, AUTO_SYNC_DELAY);
}

async function sbInitOnLoad(){
  // 配置存在则尝试恢复会话
  const cfg = sbGetCfg();
  if(!cfg.url || !cfg.anonKey){ setSyncBadge(null, "未配置"); return; }
  try{
    sbClient = await sbEnsureClient();
    const { data } = await sbClient.auth.getSession();
    sbUser = data?.session?.user || null;
    if(sbUser){
      setSyncBadge("ok", "已登录");
      // 静默监听登录态变化
      sbClient.auth.onAuthStateChange((_event, session)=>{
        sbUser = session?.user || null;
        setSyncBadge(sbUser ? "ok" : null, sbUser ? "已登录" : "未登录");
        renderSettings();
      });
    }else{
      setSyncBadge(null, "未登录");
    }
  }catch(e){
    console.warn("supabase init failed:", e);
    setSyncBadge("error", "初始化失败");
  }
  renderSettings();
}

/* ============ 启动 ============ */
try{ initTheme(); }catch(e){ console.warn("initTheme:", e); }
try{ setSyncBadge(null, "未配置"); }catch(e){ console.warn("setSyncBadge:", e); }
try{ renderAll(); }catch(e){ console.warn("renderAll:", e); }
// 品牌点击切换模式（移动端为主，PC端也能用）
try{
  document.querySelector(".brand")?.addEventListener("click", ()=>{
    if(document.body.classList.contains("qa-mode")){
      exitQuickAdd();
      switchTab("dashboard");
    }else{
      enterQuickAdd();
    }
  });
}catch(e){ console.warn("brand listener:", e); }
// 移动端首次访问：自动进入快速录入
setTimeout(()=>{
  try{
    if(isMobile() && localStorage.getItem("qa_dismissed_v1")!=="1"){
      enterQuickAdd();
    }
  }catch(e){ console.warn("auto quickadd:", e); }
}, 300);
// 页面加载后，若有持仓则自动刷新一次行情
if(DB.holdings.length)setTimeout(()=>{ try{ refreshQuotes(true); }catch(e){ console.warn("refreshQuotes:", e); } },600);
// 异步恢复 Supabase 登录会话（不阻塞界面）
setTimeout(()=>{ try{ sbInitOnLoad(); }catch(e){ console.warn("sbInit:", e); } }, 80);
</script>
</body>
</html>
